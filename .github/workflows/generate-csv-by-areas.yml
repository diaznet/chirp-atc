name: Generate CSVs and Publish AIRAC Release

# Releases follow the AIRAC cycle (28 days, effective on Thursdays).
# GitHub cron cannot express "every 28 days", so the schedule runs daily and
# only generates/publishes when the current cycle has no release yet. A missed
# or delayed scheduled run is therefore caught up by the next one.
#
# - schedule:          publish airac-YYNN once, on (or right after) its effective date
# - push / dispatch to main: regenerate and update the current cycle's release in place
# - other branches:    build only, CSVs kept as workflow artifacts
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write  # Required to create and update releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  generate-csvs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Compute current AIRAC cycle
      id: airac
      run: python airac.py

    - name: Decide whether to generate and publish
      id: gate
      env:
        TAG: airac-${{ steps.airac.outputs.ident }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then exists=true; else exists=false; fi
        if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
          if [ "$exists" = "true" ]; then generate=false; else generate=true; fi
          publish=$generate
        elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
          generate=true; publish=true
        else
          generate=true; publish=false
        fi
        echo "Release $TAG exists: $exists -> generate=$generate publish=$publish"
        {
          echo "tag=$TAG"
          echo "generate=$generate"
          echo "publish=$publish"
        } >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      if: steps.gate.outputs.generate == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      if: steps.gate.outputs.generate == 'true'
      run: python -m pytest -q

    - name: Generate CSVs
      if: steps.gate.outputs.generate == 'true'
      run: |
        python build_all.py --areas areas.yaml --output-dir dist
        echo "fetched_at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

    - name: Keep artifacts when not releasing
      if: steps.gate.outputs.generate == 'true' && steps.gate.outputs.publish != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: CSVs-AIRAC-${{ steps.airac.outputs.ident }}
        path: dist/*.CSV
        retention-days: 5

    - name: Create or update AIRAC release
      if: steps.gate.outputs.publish == 'true'
      env:
        TAG: ${{ steps.gate.outputs.tag }}
        IDENT: ${{ steps.airac.outputs.ident }}
        EFFECTIVE: ${{ steps.airac.outputs.effective }}
        NEXT_EFFECTIVE: ${{ steps.airac.outputs.next_effective }}
      run: |
        title="AIRAC ${IDENT} (effective ${EFFECTIVE})"
        cat > notes.md <<EOF
        CHIRP CSV files for AIRAC cycle **${IDENT}**.

        - Effective: ${EFFECTIVE}
        - Next cycle: ${NEXT_EFFECTIVE}
        - OpenAIP data fetched: ${fetched_at}
        - Built from: ${GITHUB_SHA}

        Data is sourced from [OpenAIP](https://www.openaip.net/), a community-maintained
        database that is not itself updated on the AIRAC schedule. Always check official
        publications before relying on a frequency.
        EOF

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Updating existing release $TAG"
          gh release upload "$TAG" dist/*.CSV --clobber
          # Remove assets that are no longer generated (e.g. a renamed area).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            [ -f "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
          done
          gh release edit "$TAG" --title "$title" --notes-file notes.md --latest
        else
          echo "Creating release $TAG"
          gh release create "$TAG" dist/*.CSV --title "$title" --notes-file notes.md \
            --target "$GITHUB_SHA" --latest
        fi
